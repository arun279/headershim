name: Store credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to Google Cloud
        id: store-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Read the store item
        env:
          TOKEN: ${{ steps.store-auth.outputs.access_token }}
          STORE_ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/ecejnncfklopghicmcigpmdfogblpigd
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/$STORE_ITEM:fetchStatus"
