name: Security alert

on:
  workflow_run:
    workflows: [Security]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Scheduled security scan failed on main"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq ".[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The weekly scan failed: $RUN_URL. A failing scan blocks every merge and release until it is fixed."
          fi
