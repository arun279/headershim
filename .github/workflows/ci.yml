name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Fetch previous pull request revision
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          PLAYWRIGHT_PREVIOUS_REF: ${{ github.event.before }}
        run: git fetch --no-tags origin "$PLAYWRIGHT_PREVIOUS_REF"
      - run: pnpm check
        env:
          PLAYWRIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_PREVIOUS_REFS: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before || '' }}
      # Dependency vulnerabilities are gated by the osv-scanner job in
      # security.yml (fail-on-vuln, recursive, with a documented allowlist).
      # The npm registry retired the legacy audit endpoint pnpm audit used, so
      # it is not run here.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-mv3
          path: .output/chrome-mv3

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Pure headless: the persistent-context extension load works under
      # channel:'chromium' headless, so no virtual display is needed. If a
      # future Chromium regresses service-worker startup under headless, run
      # headed instead by wrapping the command in Xvfb and forcing a window:
      #   run: xvfb-run -a env HEADED=1 pnpm e2e
      - run: pnpm e2e
