name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.compare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: compare
        run: |
          current=$(jq -r .version package.json)
          previous=$(git show HEAD^:package.json | jq -r .version)
          if [ "$current" != "$previous" ]; then
            echo "tag=v$current" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          PLAYWRIGHT_BASE_REF: HEAD^

  e2e:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  security:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  build-and-release:
    needs: [version, check, e2e, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      STORE_ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/ecejnncfklopghicmcigpmdfogblpigd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build release archive
        run: pnpm zip
      - name: Enforce release manifest policy
        run: node scripts/manifest-policy.mjs --release
      - name: Compute checksums
        run: |
          cd .output
          sha256sum *.zip > SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '.output/*.zip'
      - name: Publish the GitHub release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Verify the downloaded archive with gh attestation verify <zip> --owner ${{ github.repository_owner }}." \
            .output/*.zip \
            .output/SHA256SUMS \
            "$BUNDLE_PATH"
      - name: Authenticate to Google Cloud
        id: store-auth
        if: vars.CWS_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Submit to the Chrome Web Store
        if: steps.store-auth.conclusion == 'success'
        env:
          TOKEN: ${{ steps.store-auth.outputs.access_token }}
        run: |
          upload=$(curl --fail-with-body -sS -X POST -T .output/*-chrome.zip \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            "https://chromewebstore.googleapis.com/upload/v2/$STORE_ITEM:upload")
          echo "$upload"
          state=$(jq -r '.uploadState // "SUCCESS"' <<< "$upload")
          if [ "$state" != "SUCCESS" ]; then
            echo "upload did not succeed: $state"
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/$STORE_ITEM:publish"
